/**:
  ros__parameters:
    backend: "grid2d"
    global_frame: "map"
    scan_topic: "/scan"
    publish_period: 1.0
    window_mode: "time"           # "time": close a window every window_period_s of message time (robust to loss);
                                  # "scans": every layer_interval integrated messages (the engine rule, rate-dependent)
    window_period_s: 1.0          # with "time": window length; the periodic period is period_windows x window_period_s (24 s)
    expected_scan_rate_hz: 0.0    # sensor rate for drop estimation and checks; 0 estimates it from stamps
    rate_warn_drop_fraction: 0.05 # /diagnostics warns above this share of lost messages (scan windows)
    input_timeout_s: 5.0          # /diagnostics turns ERROR after this long without input, once input was seen
    startup_timeout_s: 30.0       # ... and after this long if no input has arrived since start; also how long
                                  # a failing TF lookup (no localizer yet) may keep everything out before WARN
    save_path: "/tmp/strata_2d"
    grid_width: 400
    grid_height: 400
    grid_resolution: 0.05
    grid_origin_x: -10.0
    grid_origin_y: -10.0
    # ---- evidence (version 0.2.0) ----
    evidence_model: "sprt"        # "sprt": sequential test, increments and thresholds derived from m0, m1, alpha, beta
                                  # "legacy": the v0.1 rule; it reads l_hit .. prune_prob below, which "sprt" ignores (nine keys)
    m0: 0.20                      # hit rate per window at or below which a cell is clutter
    m1: 0.70                      # hit rate per window at or above which a cell is structure
    alpha: 0.01                   # bound on P(clutter at m0 or less graduates in the FIRST test of one cell history), independent windows only
                                  # (paper Proposition ville). Restarts after a demotion are not covered; real windows are autocorrelated and the
                                  # per-cell rate on real clutter was above alpha (paper section 4c). Not a guarantee for the whole map.
    beta: 0.01                    # bound on P(structure at m1 or more is rejected in the FIRST test of one cell history), independent windows only,
                                  # Periodic veto off; with the veto on, the bound is larger (paper Proposition ville)
    n_max_undecided: 80           # touched windows after which an undecided, non-periodic cell is read out Intermittent (0: never)
    evidence_calibration: "measured_2d"
                                  # measured_2d: (m0, m1) measured on LILocBench, 0.05 m, 1.0 s windows (15 scans at 15 Hz);
                                  # PROVISIONAL until PREREG.md is frozen. Re-derive them for another sensor, window or resolution.
    layer_interval: 10
    l_hit: 0.85
    l_miss: -0.4
    l_min: -5.0
    l_max: 5.0
    survival_decay: 0.97
    graduate_prob: 0.8
    demote_prob: 0.45
    min_observations: 3
    prune_prob: 0.05
    enable_periodicity: true
    periodic_amplitude_min: 0.3
    periodic_false_alarm: 0.2
    periodic_alpha_spending: true
    period_windows: 24
    n_harmonics: 2
