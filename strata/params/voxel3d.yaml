/**:
  ros__parameters:
    backend: "voxel3d"
    global_frame: "map"
    points_topic: "/points"
    publish_period: 1.0
    window_mode: "time"           # "time": close a window every window_period_s of message time (robust to loss);
                                  # "scans": every layer_interval integrated messages (the engine rule, rate-dependent)
    window_period_s: 1.0          # with "time": layer_interval / sensor rate (10 / 10 Hz here); recompute if either changes
    expected_scan_rate_hz: 0.0    # sensor rate for drop estimation and checks; 0 estimates it from stamps
    rate_warn_drop_fraction: 0.05 # /diagnostics warns above this share of lost messages (scan windows)
    input_timeout_s: 5.0          # /diagnostics turns ERROR after this long without input
    save_path: "/tmp/strata_3d"
    voxel_size: 0.2
    layer_interval: 10
    l_hit: 0.85
    l_miss: -0.4
    l_min: -5.0
    l_max: 5.0
    survival_decay: 0.97
    graduate_prob: 0.8
    demote_prob: 0.45
    min_observations: 3
    prune_prob: 0.05
    enable_periodicity: true
    periodic_amplitude_min: 0.3
    periodic_false_alarm: 0.2
    periodic_alpha_spending: true
    period_windows: 24
    n_harmonics: 2
