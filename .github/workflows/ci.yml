name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  core-tests:
    name: core unit tests (no ROS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libeigen3-dev libgtest-dev

      - name: strata_core — build & test
        run: |
          cmake -S strata_core -B build/core -DSTRATA_CORE_BUILD_TESTS=ON
          cmake --build build/core -j
          ( cd build/core && ctest --output-on-failure )

  ros-humble:
    name: ROS 2 Humble build, test and parameter binding
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (rosdep)
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-yaml
          rosdep update
          rosdep install --from-paths strata strata_core --ignore-src -y --rosdistro humble --skip-keys rviz2

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select strata_core strata --cmake-args -DBUILD_TESTING=ON

      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --packages-select strata --event-handlers console_direct+
          colcon test-result --verbose

      - name: Launch each backend and check that every YAML parameter is applied
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          for backend in grid2d voxel3d; do
            ros2 launch strata "${backend}.launch.py" rviz:=false > "launch_${backend}.log" 2>&1 &
            pid=$!
            status=0
            python3 scripts/check_param_binding.py "install/strata/share/strata/params/${backend}.yaml" --node strata || status=$?
            grep -a "strata up: backend=${backend}" "launch_${backend}.log" || { echo "node did not report backend=${backend}"; status=1; }
            kill -INT "$pid"; wait "$pid" || true
            if [ "$status" -ne 0 ]; then cat "launch_${backend}.log"; exit 1; fi
          done
